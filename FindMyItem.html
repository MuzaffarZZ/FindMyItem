<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FindMyItem</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="phone">
  <div class="screen">
    <header>
      <span class="icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="white" stroke-width="2"/>
          <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <h1>FindMyItem</h1>
    </header>

    <main>
      <div class="search-box item-search-box">
        <label for="itemSearchInput">CARI ITEM</label>
        <input id="itemSearchInput" type="text" placeholder="Contoh: sabun, kopi, buku..." autocomplete="off">
        <div class="search-suggestions" id="searchSuggestions"></div>
      </div>

      <div class="search-box">
        <label for="categorySelect">CATEGORY</label>
        <select id="categorySelect">
          <option value="">Pilih kategori...</option>
        </select>
      </div>

      <div class="result-card">
        <div class="result-msg" id="resultMsg">
          Pilih kategori atau cari item untuk melihat lokasinya.
        </div>

        <div class="rack-panel">
          <div class="title">PELAN KEDUDUKAN RAK (TOP-DOWN VIEW)</div>

          <svg class="plan" viewBox="0 0 1000 1200" role="img" aria-label="Pelan kedudukan rak kedai">
            <defs>
              <linearGradient id="gOff" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#4a6350"/><stop offset="1" stop-color="#263a2a"/>
              </linearGradient>
              <linearGradient id="gCat" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#15803d"/>
              </linearGradient>
              <linearGradient id="gItem" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#f87171"/><stop offset="1" stop-color="#b91c1c"/>
              </linearGradient>

              <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff" />
              </marker>
            </defs>

            <!-- Kiri -->
            <g class="zone" data-zone="airSejuk">
              <rect x="10" y="190" width="115" height="480" rx="18"/>
              <g transform="rotate(-90 67 430)">
                <text class="t-md" x="67" y="408" dy=".35em">Air Minuman</text>
                <text class="t-md" x="67" y="452" dy=".35em">(Sejuk)</text>
              </g>
            </g>
            <g class="zone" data-zone="vendor">
              <rect x="160" y="190" width="150" height="480" rx="18"/>
              <text class="t-xl" x="235" y="430" dy=".35em" transform="rotate(-90 235 430)">Makanan Vendor</text>
            </g>
            <g class="fixed counter">
              <rect x="10" y="950" width="340" height="230" rx="18"/>
              <text class="t-lg" x="180" y="1035" dy=".35em">Kaunter</text>
              <text class="t-lg" x="180" y="1095" dy=".35em">Pembayaran</text>
            </g>

            <!-- Tengah -->
            <g class="zone" data-zone="roti1">
              <rect x="395" y="170" width="100" height="168" rx="18"/>
              <text class="t-sm" x="445" y="254" dy=".35em">Roti</text>
            </g>
            <g class="zone" data-zone="snek">
              <rect x="505" y="170" width="305" height="81" rx="16"/>
              <text class="t-md" x="657" y="210" dy=".35em">Snek Ringan</text>
            </g>
            <g class="zone" data-zone="mi">
              <rect x="505" y="257" width="305" height="81" rx="16"/>
              <text class="t-md" x="657" y="297" dy=".35em">Mi segera</text>
            </g>

            <g class="zone" data-zone="roti2">
              <rect x="395" y="378" width="100" height="168" rx="18"/>
              <text class="t-sm" x="445" y="462" dy=".35em">Roti</text>
            </g>
            <g class="zone" data-zone="biskut">
              <rect x="505" y="378" width="305" height="81" rx="16"/>
              <text class="t-md" x="657" y="418" dy=".35em">Biskut</text>
            </g>
            <g class="zone" data-zone="gula">
              <rect x="505" y="465" width="305" height="81" rx="16"/>
              <text class="t-md" x="657" y="505" dy=".35em">Gula-gula</text>
            </g>

            <g class="zone" data-zone="minuman">
              <rect x="505" y="586" width="305" height="81" rx="16"/>
              <text class="t-md" x="657" y="626" dy=".35em">Minuman</text>
            </g>
            <g class="zone" data-zone="bahan">
              <rect x="505" y="673" width="305" height="81" rx="16"/>
              <text class="t-md" x="657" y="713" dy=".35em">Bahan Dapur</text>
            </g>

            <g class="zone" data-zone="alat">
              <rect x="505" y="794" width="305" height="81" rx="16"/>
              <text class="t-md" x="657" y="834" dy=".35em">Alat tulis</text>
            </g>
            <g class="zone" data-zone="tisu">
              <rect x="505" y="881" width="305" height="81" rx="16"/>
              <text class="t-md" x="657" y="921" dy=".35em">Tisu &amp; Sabun</text>
            </g>

            <!-- Kanan -->
            <g class="zone" data-zone="rumah">
              <rect x="875" y="20" width="115" height="430" rx="18"/>
              <g transform="rotate(90 932 235)">
                <text class="t-lg" x="932" y="209" dy=".35em">Barang Keperluan</text>
                <text class="t-lg" x="932" y="261" dy=".35em">Rumah</text>
              </g>
            </g>
            <g class="zone" data-zone="aiskrim">
              <rect x="875" y="586" width="115" height="376" rx="18"/>
              <text class="t-xl" x="932" y="774" dy=".35em" transform="rotate(90 932 774)">Aiskrim</text>
            </g>

            <!-- Bawah -->
            <g class="fixed">
              <rect x="420" y="1040" width="210" height="140" rx="18"/>
              <text class="t-sm" x="525" y="1090" dy=".35em">Mesin Kopi</text>
              <text class="t-sm" x="525" y="1130" dy=".35em">Automatic</text>
            </g>
            <g class="zone" data-zone="goreng">
              <rect x="640" y="1040" width="280" height="140" rx="18"/>
              <text class="t-lg" x="780" y="1090" dy=".35em">Makanan</text>
              <text class="t-lg" x="780" y="1132" dy=".35em">(Goreng)</text>
            </g>

            <!-- Anda di sini -->
            <g class="here" aria-hidden="true">
              <circle class="ring" cx="130" cy="58" r="14"/>
              <circle class="ring r2" cx="130" cy="58" r="14"/>
              <circle class="dot" cx="130" cy="58" r="14"/>
              <text x="130" y="122" dy=".35em">Anda di sini</text>
            </g>

            <!-- Laluan panah -->
            <path class="route-path" id="dynamicRoute" d="" style="display: none;" />
          </svg>

          <div class="map-legend">
            <span><i class="dot dot-item"></i>Lokasi item</span>
            <span><i class="dot dot-cat"></i>Zon kategori</span>
          </div>
        </div>

        <div class="popular-section">
          <div class="heading">PRODUK POPULAR</div>
          <div class="popular-grid" id="popularGrid"></div>
        </div>

        <div class="item-list" id="itemList"></div>
      </div>
    </main>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
