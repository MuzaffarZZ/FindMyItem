    --card:#16241a;

    --border:#2c4433;
    --cyan:#22c55e;

  *{box-sizing:border-box;}

  @keyframes fadeSlideUp{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes fadeIn{
    from{ opacity:0; }
    to{ opacity:1; }
  }
  @keyframes popIn{
    0%{ opacity:0; transform:scale(.85); }
    70%{ opacity:1; transform:scale(1.04); }
    100%{ opacity:1; transform:scale(1); }
  }

    .result-msg,
    .rack{

  }

  .phone{
    width:340px;
    background:#070d08;
    border-radius:34px;
    padding:12px;
    box-shadow:0 30px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.05);
  }

  .screen{
    background:#101d13;
    border-radius:24px;
    overflow:hidden;
  }

  header{
    position:relative;
    background:linear-gradient(135deg, var(--teal), var(--teal-dark));
    color:#fff;
    padding:26px 20px;
    display:flex;
    align-items:center;
    gap:10px;
    overflow:hidden;
  }
  header::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240' viewBox='0 0 240 240'><g fill='none' stroke='white' stroke-opacity='0.22' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'><g transform='translate(10,20) rotate(-8)'><path d='M0 12h10l4 26h44l6-20H36'/><circle cx='34' cy='44' r='4' fill='white' fill-opacity='0.22' stroke='none'/><circle cx='58' cy='44' r='4' fill='white' fill-opacity='0.22' stroke='none'/></g><g transform='translate(150,10) rotate(10)'><path d='M8 4h18v20a9 9 0 0 1-18 0z'/><path d='M8 14H0v46h34V14H26'/></g><g transform='translate(30,130) rotate(6)'><path d='M0 32h18l3 5h4l3-5h18v20H0z'/><path d='M11 32V18a11 11 0 0 1 22 0v14'/></g><g transform='translate(160,140) rotate(-10)'><circle cx='20' cy='20' r='18'/><path d='M12 20l6 6 11-12'/></g></g></svg>");
    background-repeat:repeat;
    background-size:140px 140px;
    background-position:center;
    pointer-events:none;
  }
  header .icon, header h1{
    position:relative;
    z-index:1;
  }
  header .icon{
    width:22px;height:22px;
    display:inline-flex;align-items:center;justify-content:center;
  }
  header h1{
    margin:0;
    font-size:16px;
    letter-spacing:.5px;
    font-weight:800;
  }

  main{ padding:16px; }

  .search-box{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    box-shadow:0 2px 6px rgba(20,30,50,.05);
    margin-bottom:14px;
  }
  .search-box label{
    display:block;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.6px;
    color:var(--muted);
    margin-bottom:8px;
  }
  .search-box input{
    width:100%;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px 12px;
    font-size:14.5px;
    color:var(--ink);
    outline:none;
  }
  .search-box input::placeholder{
    color:var(--muted);
  }
  .search-box input:focus{
    border-color:var(--teal);
    box-shadow:0 0 0 3px rgba(34,197,94,.2);
  }
  .item-search-box{
    position:relative;
  }
  .search-suggestions{
    position:absolute;
    left:14px;
    right:14px;
    top:calc(100% - 2px);
    background:var(--card);
    border:1px solid var(--border);
    border-top:none;
    border-radius:0 0 10px 10px;
    box-shadow:0 8px 16px rgba(0,0,0,.35);
    overflow:hidden;
    z-index:5;
    display:none;
  }
  .search-suggestions.open{ display:block; }
  .search-suggestions .sug-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:9px 12px;
    font-size:13px;
    color:var(--ink);
    cursor:pointer;
    border-top:1px solid var(--border);
  }
  .search-suggestions .sug-item:first-child{ border-top:none; }
  .search-suggestions .sug-item:hover{
    background:rgba(34,197,94,.12);
  }
  .search-suggestions .sug-item .sug-cat{
    font-size:10.5px;
    color:var(--muted);
    margin-left:8px;
  }
  .search-suggestions .sug-tag{
    font-size:9.5px;
    font-weight:700;
    color:#fff;
    background:var(--teal-dark);
    padding:2px 7px;
    border-radius:10px;
    flex-shrink:0;
  }
  .search-suggestions .sug-empty{
    padding:10px 12px;
    font-size:12.5px;
    color:var(--muted);
  }
  .search-box select{
    width:100%;
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px 12px;
    font-size:14px;
    color:var(--ink);
    outline:none;
    background:var(--card);
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238fb39c' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;
    background-position:right 12px center;
    background-size:16px;
    padding-right:34px;
  }
  .search-box select:focus{
    border-color:var(--teal);
    box-shadow:0 0 0 3px rgba(34,197,94,.2);
  }

  .result-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    box-shadow:0 2px 6px rgba(20,30,50,.05);
  }

  .result-msg{
    display:flex;
    gap:8px;
    align-items:flex-start;
    background:rgba(74,222,128,.12);
    border-left:3px solid var(--cyan);
    border-radius:8px;
    padding:10px 12px;
    font-size:13px;
    line-height:1.5;
    color:var(--ink);
    margin-bottom:14px;
    min-height:38px;
    animation:fadeIn .35s ease;
  }
  .result-msg .pin{ color:var(--teal); font-size:14px; margin-top:1px; }
  .result-msg b{ color:var(--cyan); }
  .result-msg .rak-name{ color:var(--teal); }

  .rack-panel{
    background:var(--panel);
    border-radius:12px;
    padding:14px 12px 16px;
  }
  .rack-panel .title{
    text-align:center;
    color:var(--muted);
    font-size:9.5px;
    font-weight:700;
    letter-spacing:1px;
    margin-bottom:16px;
  }
  .racks{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:14px;
    height:100px;
  }
  .rack{
    width:38px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    animation:popIn .45s ease both;
  }
  .rack .bar{
    width:38px;
    height:88px;
    border-radius:6px;
    background:linear-gradient(180deg,#4a6350,#263a2a);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#d6ecdc;
    font-size:11px;
    font-weight:700;
    transition:all .35s ease;
  }
  .rack.active .bar{
    background:linear-gradient(180deg,#f87171,#b91c1c);
    color:#fff;
    box-shadow:0 0 18px rgba(239,68,68,.8);
    transform:translateY(-4px);
  }
  .rack .label{
    color:#6f9179;
    font-size:9.5px;
    letter-spacing:.4px;
  }
  .rack.active .label{ color:var(--teal); font-weight:700; }

  .suggestions{
    margin-top:8px;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .suggestions button{
    border:1px solid var(--border);
    background:var(--card);
    color:var(--muted);
    font-size:11px;
    padding:5px 9px;
    border-radius:20px;
    cursor:pointer;
  }
  .suggestions button:hover{
    border-color:var(--teal);
    color:var(--teal-dark);
  }

  .empty{
    color:var(--muted);
    font-size:12.5px;
  }

  .item-list{
    margin-top:12px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .item-list .item-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#1a2b1f;
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 10px;
    font-size:12.5px;
    color:var(--ink);
    animation:fadeSlideUp .4s ease both;
  }
  .item-list .item-row.highlight{
    background:rgba(234,179,8,.14);
    border-color:var(--orange);
  }
  .item-list .item-row.highlight .rak-tag{
    background:var(--orange);
  }

  .popular-section{
    margin-top:14px;
    margin-bottom:6px;
  }
  .popular-section .heading{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.6px;
    color:var(--muted);
    margin-bottom:8px;
    padding:0 2px;
  }
  .popular-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .popular-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    padding:9px 10px;
    text-align:left;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(20,30,50,.05);
    display:flex;
    flex-direction:column;
    gap:3px;
    animation:fadeSlideUp .4s ease both;
  }
  .popular-card:hover{
    border-color:var(--teal);
  }
  .popular-card .pname{
    font-size:12px;
    font-weight:600;
    color:var(--ink);
  }
  .popular-card .pcat{
    font-size:10px;
    color:var(--muted);
  }
  .popular-card .prak{
    align-self:flex-start;
    margin-top:2px;
    font-size:9.5px;
    font-weight:700;
    color:#fff;
    background:var(--teal-dark);
    padding:2px 7px;
    border-radius:10px;
  }
  .item-list .item-row .rak-tag{
    font-size:10.5px;
    font-weight:700;
    color:#fff;
    background:var(--teal-dark);
    padding:3px 8px;
    border-radius:12px;
  }

  /* ===== Pelan kedai (floor plan) ===== */
  .phone{ width:100%; max-width:440px; }
  .rack-panel{ padding:14px 12px 12px; }
  .rack-panel .title{ margin-bottom:12px; }

  .plan{ display:block; width:100%; height:auto; }
  .plan text{ fill:#d6ecdc; font-weight:700; text-anchor:middle; pointer-events:none; }
  .plan .t-sm{ font-size:32px; }
  .plan .t-md{ font-size:36px; }
  .plan .t-lg{ font-size:40px; }
  .plan .t-xl{ font-size:44px; }

  .plan .zone{ animation:fadeIn .5s ease both; }
  .plan .zone rect{
    fill:url(#gOff);
    transition:filter .35s ease;
  }
  .plan .zone.cat-on rect{
    fill:url(#gCat);
    filter:drop-shadow(0 0 12px rgba(34,197,94,.7));
  }
  .plan .zone.item-on rect{
    fill:url(#gItem);
    animation:zonePulse 1.4s ease-in-out infinite;
  }
  .plan .zone.cat-on text,
  .plan .zone.item-on text{ fill:#fff; }

  .plan .fixed rect{ fill:#16241a; stroke:#2c4433; stroke-width:3; }
  .plan .fixed.counter rect{ fill:#060a07; }
  .plan .fixed text{ fill:#8fb39c; }
  .plan .door-line,
  .plan .door-arc{ fill:none; stroke:#8fb39c; stroke-width:6; stroke-linecap:round; }

  @keyframes zonePulse{
    0%,100%{ filter:drop-shadow(0 0 8px rgba(239,68,68,.65)); }
    50%{ filter:drop-shadow(0 0 22px rgba(239,68,68,1)); }
  }

  .map-legend{
    display:flex;
    justify-content:center;
    gap:16px;
    margin-top:10px;
    font-size:10px;
    color:var(--muted);
  }
  .map-legend .dot{
    display:inline-block;
    width:9px;
    height:9px;
    border-radius:3px;
    margin-right:5px;
    vertical-align:-1px;
  }
  .dot-item{ background:#ef4444; }
  .dot-cat{ background:#16a34a; }

  .item-list .item-row{ cursor:pointer; transition:border-color .2s ease, background .2s ease; }
  .item-list .item-row:hover{ border-color:var(--teal); }
  .result-msg .rak-name{ color:#f87171; }

  @media (prefers-reduced-motion: reduce){
    .plan .zone, .plan .zone rect{ animation:none !important; }
  }

  /* ===== Penanda "Anda di sini" ===== */
  .plan .here{ pointer-events:none; }
  .plan .here .dot{ fill:#fff; animation:hereBlink 1.2s ease-in-out infinite; }
  .plan .here .ring{
    fill:none;
    stroke:#fff;
    stroke-width:5;
    transform-box:fill-box;
    transform-origin:center;
    animation:herePing 1.8s ease-out infinite;
  }
  .plan .here .ring.r2{ animation-delay:.9s; }
  .plan .here text{
    fill:#fff;
    font-size:36px;
    font-weight:800;
    text-anchor:middle;
    animation:hereBlink 1.2s ease-in-out infinite;
  }
  @keyframes hereBlink{
    0%,100%{ opacity:1;   filter:drop-shadow(0 0 10px rgba(255,255,255,.95)); }
    50%{     opacity:.35; filter:drop-shadow(0 0 2px rgba(255,255,255,.3)); }
  }
  @keyframes herePing{
    0%{   transform:scale(.6); opacity:.9; }
    100%{ transform:scale(3.2); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .plan .here .dot, .plan .here .ring, .plan .here text{ animation:none !important; }
    .plan .here .ring{ display:none; }
  }
</style>
</head>
<body>

<div class="phone">
  <div class="screen">
    <header>
      <span class="icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <circle cx="11" cy="11" r="7" stroke="white" stroke-width="2"/>
          <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </span>
      <h1>FindMyItem</h1>
    </header>

    <main>
      <div class="search-box item-search-box">
        <label>CARI ITEM</label>
        <input id="itemSearchInput" type="text" placeholder="Contoh: sabun, kopi, buku..." autocomplete="off">
        <div class="search-suggestions" id="searchSuggestions"></div>
      </div>

      <div class="search-box">
        <label>CATEGORY</label>
        <select id="categorySelect">
          <option value="">Pilih kategori...</option>
        </select>
      </div>

      <div class="result-card">
        <div class="result-msg" id="resultMsg">
          Pilih kategori atau cari item untuk melihat lokasinya.
        </div>

        <div class="rack-panel">
          <div class="title">PELAN KEDUDUKAN RAK (TOP-DOWN VIEW)</div>

          <svg class="plan" viewBox="0 0 1000 1200" role="img" aria-label="Pelan kedudukan rak kedai">
            <defs>
              <linearGradient id="gOff" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#4a6350"/><stop offset="1" stop-color="#263a2a"/>
              </linearGradient>
              <linearGradient id="gCat" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#15803d"/>
              </linearGradient>
              <linearGradient id="gItem" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#f87171"/><stop offset="1" stop-color="#b91c1c"/>
              </linearGradient>
            </defs>

            <!-- Kiri -->
            <g class="zone" data-zone="airSejuk">
              <rect x="10" y="190" width="115" height="480" rx="18"/>
              <g transform="rotate(-90 67 430)">
                <text class="t-md" x="67" y="408" dy=".35em">Air Minuman</text>
                <text class="t-md" x="67" y="452" dy=".35em">(Sejuk)</text>
              </g>
            </g>
            <g class="zone" data-zone="vendor">
              <rect x="160" y="190" width="150" height="480" rx="18"/>
              <text class="t-xl" x="235" y="430" dy=".35em" transform="rotate(-90 235 430)">Makanan Vendor</text>
            </g>
            <g class="fixed counter">
              <rect x="10" y="950" width="340" height="230" rx="18"/>
              <text class="t-lg" x="180" y="1035" dy=".35em">Kaunter</text>
              <text class="t-lg" x="180" y="1095" dy=".35em">Pembayaran</text>
            </g>

            <!-- Tengah -->
            <g class="zone" data-zone="roti1">
              <rect x="395" y="170" width="100" height="168" rx="18"/>
              <text class="t-sm" x="445" y="254" dy=".35em">Roti</text>
            </g>
            <g class="zone" data-zone="snek">
              <rect x="505" y="170" width="305" height="81" rx="16"/>
              <text class="t-md" x="657" y="210" dy=".35em">Snek Ringan</text>
            </g>
            <g class="zone" data-zone="mi">
              <rect x="505" y="257" width="305" height="81" rx="16"/>
              <text class="t-md" x="657" y="297" dy=".35em">Mi segera</text>
            </g>

            <g class="zone" data-zone="roti2">
              <rect x="395" y="378" width="100" height="168" rx="18"/>
              <text class="t-sm" x="445" y="462" dy=".35em">Roti</text>
            </g>
            <g class="zone" data-zone="biskut">
              <rect x="505" y="378" width="305" height="81" rx="16"/>
              <text class="t-md" x="657" y="418" dy=".35em">Biskut</text>
            </g>
            <g class="zone" data-zone="gula">
              <rect x="505" y="465" width="305" height="81" rx="16"/>
              <text class="t-md" x="657" y="505" dy=".35em">Gula-gula</text>
            </g>

            <g class="zone" data-zone="minuman">
              <rect x="505" y="586" width="305" height="81" rx="16"/>
              <text class="t-md" x="657" y="626" dy=".35em">Minuman</text>
            </g>
            <g class="zone" data-zone="bahan">
              <rect x="505" y="673" width="305" height="81" rx="16"/>
              <text class="t-md" x="657" y="713" dy=".35em">Bahan Dapur</text>
            </g>

            <g class="zone" data-zone="alat">
              <rect x="505" y="794" width="305" height="81" rx="16"/>
              <text class="t-md" x="657" y="834" dy=".35em">Alat tulis</text>
            </g>
            <g class="zone" data-zone="tisu">
              <rect x="505" y="881" width="305" height="81" rx="16"/>
              <text class="t-md" x="657" y="921" dy=".35em">Tisu &amp; Sabun</text>
            </g>

            <!-- Kanan -->
            <g class="zone" data-zone="rumah">
              <rect x="875" y="20" width="115" height="430" rx="18"/>
              <g transform="rotate(90 932 235)">
                <text class="t-lg" x="932" y="209" dy=".35em">Barang Keperluan</text>
                <text class="t-lg" x="932" y="261" dy=".35em">Rumah</text>
              </g>
            </g>
            <g class="zone" data-zone="aiskrim">
              <rect x="875" y="586" width="115" height="376" rx="18"/>
              <text class="t-xl" x="932" y="774" dy=".35em" transform="rotate(90 932 774)">Aiskrim</text>
            </g>

            <!-- Bawah -->
            <g class="fixed">
              <rect x="420" y="1040" width="210" height="140" rx="18"/>
              <text class="t-sm" x="525" y="1090" dy=".35em">Mesin Kopi</text>
              <text class="t-sm" x="525" y="1130" dy=".35em">Automatic</text>
            </g>
            <g class="zone" data-zone="goreng">
              <rect x="640" y="1040" width="280" height="140" rx="18"/>
              <text class="t-lg" x="780" y="1090" dy=".35em">Makanan</text>
              <text class="t-lg" x="780" y="1132" dy=".35em">(Goreng)</text>
            </g>
          
            <!-- Anda di sini (kawasan pintu masuk) -->
            <g class="here" aria-hidden="true">
              <circle class="ring" cx="130" cy="58" r="14"/>
              <circle class="ring r2" cx="130" cy="58" r="14"/>
              <circle class="dot" cx="130" cy="58" r="14"/>
              <text x="130" y="122" dy=".35em">Anda di sini</text>
            </g>
          </svg>

          <div class="map-legend">
            <span><i class="dot dot-item"></i>Lokasi item</span>
            <span><i class="dot dot-cat"></i>Zon kategori</span>
          </div>
        </div>

        <div class="popular-section">
          <div class="heading">PRODUK POPULAR</div>
          <div class="popular-grid" id="popularGrid"></div>
        </div>

        <div class="item-list" id="itemList"></div>
      </div>
    </main>
  </div>
</div>

<script>
  // Nama zon pada pelan kedai
  const zoneLabels = {
    airSejuk: 'Air Minuman (Sejuk)',
    vendor:   'Makanan Vendor',
    roti1:    'Roti 1',
    roti2:    'Roti 2',
    snek:     'Snek Ringan',
    mi:       'Mi Segera',
    biskut:   'Biskut',
    gula:     'Gula-gula',
    minuman:  'Minuman',
    bahan:    'Bahan Dapur',
    alat:     'Alat Tulis',
    tisu:     'Tisu & Sabun',
    rumah:    'Barang Keperluan Rumah',
    aiskrim:  'Aiskrim',
    goreng:   'Makanan (Goreng)'
  };

  // Setiap kategori ada beberapa zon; setiap item ada zon tepatnya: [nama item, zon]
  const categories = {
    "Makanan & Keperluan Dapur": {
      zones: ['airSejuk','vendor','roti1','snek','mi','roti2','biskut','gula','minuman','bahan','aiskrim','goreng'],
      items: [
        ["Air Mineral","airSejuk"], ["Milo Tin","airSejuk"],
        ["Nasi Lemak","vendor"], ["Kuih-muih","vendor"],
        ["Roti Putih","roti1"], ["Roti Gandum","roti2"],
        ["Keropok","snek"], ["Kerepek Pisang","snek"],
        ["Mi Segera Kari","mi"], ["Mi Segera Ayam","mi"],
        ["Biskut Marie","biskut"], ["Biskut Krim","biskut"],
        ["Gula-gula Getah","gula"], ["Coklat","gula"],
        ["Kopi O Kampung","minuman"], ["Teh Tarik Sachet","minuman"], ["Susu Pekat","minuman"],
        ["Beras Wangi","bahan"], ["Minyak Masak","bahan"], ["Sos Tomato","bahan"], ["Gula Pasir","bahan"], ["Tepung Gandum","bahan"],
        ["Aiskrim Kon","aiskrim"], ["Aiskrim Tub","aiskrim"],
        ["Karipap","goreng"], ["Pisang Goreng","goreng"]
      ]
    },
    "Barangan Rumah": {
      zones: ['rumah'],
      items: [
        ["Sabun Basuh","rumah"], ["Pencuci Lantai","rumah"], ["Baldi Plastik","rumah"], ["Penyapu","rumah"],
        ["Tuala Dapur","rumah"], ["Berus Lantai","rumah"], ["Pewangi Bilik","rumah"], ["Beg Sampah","rumah"]
      ]
    },
    "Kelengkapan Diri": {
      zones: ['tisu'],
      items: [
        ["Sabun Mandi","tisu"], ["Syampu","tisu"], ["Berus Gigi","tisu"], ["Pencuci Muka","tisu"],
        ["Losyen Badan","tisu"], ["Ubat Gigi","tisu"], ["Pewangi Badan","tisu"], ["Pencukur","tisu"],
        ["Tisu Muka","tisu"], ["Tisu Tandas","tisu"]
      ]
    },
    "Kelengkapan Sekolah & Sampingan": {
      zones: ['alat'],
      items: [
        ["Buku Tulis","alat"], ["Pen & Pensel","alat"], ["Beg Sekolah","alat"], ["Gunting","alat"],
        ["Pembaris","alat"], ["Kotak Pensel","alat"], ["Kalkulator","alat"], ["Pemadam","alat"]
      ]
    }
  };

  const popularNames = ["Kopi O Kampung", "Minyak Masak", "Sabun Mandi", "Syampu", "Pencuci Lantai", "Beg Sekolah"];

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const resultMsg = $('resultMsg');
  const categorySelect = $('categorySelect');
  const itemListEl = $('itemList');
  const popularGridEl = $('popularGrid');
  const popularSectionEl = document.querySelector('.popular-section');
  const itemSearchInput = $('itemSearchInput');
  const searchSuggestionsEl = $('searchSuggestions');

  let highlightItem = null;

  // Indeks carian rata: semua item merentas semua kategori
  const searchIndex = [];
  Object.entries(categories).forEach(([category, data]) => {
    data.items.forEach(([name, zone]) => searchIndex.push({ name, category, zone }));
  });
  const findItem = name => searchIndex.find(i => i.name === name);

  // Zon pada pelan
  const zoneEls = {};
  document.querySelectorAll('.plan .zone').forEach((g, i) => {
    zoneEls[g.dataset.zone] = g;
    g.style.animationDelay = (i * 45) + 'ms';
  });

  function renderMap(catZones, focusZone){
    Object.entries(zoneEls).forEach(([id, el]) => {
      el.classList.toggle('item-on', id === focusZone);
      el.classList.toggle('cat-on', id !== focusZone && catZones.includes(id));
    });
  }

  // Isi dropdown kategori
  Object.keys(categories).forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    categorySelect.appendChild(opt);
  });

  function chooseItem(it, keepText){
    highlightItem = it.name;
    itemSearchInput.value = keepText ? it.name : '';
    closeSuggestions();
    categorySelect.value = it.category;
    showCategory();
  }

  function renderPopular(){
    popularGridEl.innerHTML = '';
    popularNames.forEach((name, i) => {
      const it = findItem(name);
      const card = document.createElement('button');
      card.className = 'popular-card';
      card.style.animationDelay = (i * 60) + 'ms';
      card.innerHTML = `
        <span class="pname">${esc(it.name)}</span>
        <span class="pcat">${esc(it.category)}</span>
        <span class="prak">${esc(zoneLabels[it.zone])}</span>
      `;
      card.onclick = () => chooseItem(it, false);
      popularGridEl.appendChild(card);
    });
  }

  // Kemas kini mesej, pelan dan baris item (tanpa bina semula senarai)
  function updateView(){
    const value = categorySelect.value;

    if(!value){
      resultMsg.innerHTML = 'Pilih kategori atau cari item untuk melihat lokasinya.';
      renderMap([], null);
      popularSectionEl.style.display = '';
      return;
    }

    popularSectionEl.style.display = 'none';
    const cat = categories[value];
    const focus = highlightItem ? findItem(highlightItem).zone : null;

    if(focus){
      resultMsg.innerHTML =
        `📍 <span><b>${esc(highlightItem)}</b> berada di <b class="rak-name">${esc(zoneLabels[focus])}</b> yang sedang menyala merah pada pelan di bawah.</span>`;
    } else {
      resultMsg.innerHTML =
        `📍 <span>Kategori <b>${esc(value)}</b> terdapat di zon yang menyala hijau pada pelan di bawah. Tekan mana-mana item untuk lihat lokasi tepatnya.</span>`;
    }

    renderMap(cat.zones, focus);
    itemListEl.querySelectorAll('.item-row').forEach(r => {
      r.classList.toggle('highlight', r.dataset.name === highlightItem);
    });
  }

  // Bina senarai item bagi kategori terpilih
  function showCategory(){
    const value = categorySelect.value;
    itemListEl.innerHTML = '';

    if(value){
      categories[value].items.forEach(([name, zone], i) => {
        const row = document.createElement('div');
        row.className = 'item-row';
        row.dataset.name = name;
        row.style.animationDelay = Math.min(i * 40, 600) + 'ms';
        row.innerHTML = `<span>${esc(name)}</span><span class="rak-tag">${esc(zoneLabels[zone])}</span>`;
        row.addEventListener('click', () => {
          highlightItem = (highlightItem === name) ? null : name;
          updateView();
          if(highlightItem){
            document.querySelector('.rack-panel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
        });
        itemListEl.appendChild(row);
      });
    }
    updateView();
  }

  // ---------- Carian item ----------
  function normalize(s){
    return s.trim().toLowerCase().replace(/\s+/g, ' ');
  }

  function closeSuggestions(){
    searchSuggestionsEl.classList.remove('open');
    searchSuggestionsEl.innerHTML = '';
  }

  function renderSuggestions(matches, query){
    if(matches.length === 0){
      searchSuggestionsEl.innerHTML =
        `<div class="sug-empty">Tiada item sepadan dengan "<b>${esc(query)}</b>". Cuba kata kunci lain.</div>`;
      searchSuggestionsEl.classList.add('open');
      return;
    }
    searchSuggestionsEl.innerHTML = '';
    matches.slice(0, 6).forEach(m => {
      const row = document.createElement('div');
      row.className = 'sug-item';
      row.innerHTML = `
        <span>${esc(m.name)}<span class="sug-cat">${esc(m.category)}</span></span>
        <span class="sug-tag">${esc(zoneLabels[m.zone])}</span>
      `;
      // mousedown berlaku sebelum blur, jadi pilihan sempat didaftarkan
      row.addEventListener('mousedown', (e) => {
        e.preventDefault();
        chooseItem(m, true);
      });
      searchSuggestionsEl.appendChild(row);
    });
    searchSuggestionsEl.classList.add('open');
  }

  function handleItemSearchInput(){
    const query = normalize(itemSearchInput.value);
    if(!query){
      closeSuggestions();
      return;
    }

    // susunan: padanan tepat > bermula dengan > mengandungi > padanan nama zon
    const scored = searchIndex
      .map(item => {
        const n = normalize(item.name);
        let score = -1;
        if(n === query) score = 0;
        else if(n.startsWith(query)) score = 1;
        else if(n.includes(query)) score = 2;
        else if(normalize(zoneLabels[item.zone]).includes(query)) score = 3;
        return { ...item, score };
      })
      .filter(item => item.score >= 0)
      .sort((a, b) => a.score - b.score);

    renderSuggestions(scored, itemSearchInput.value.trim());
  }

  itemSearchInput.addEventListener('input', handleItemSearchInput);
  itemSearchInput.addEventListener('focus', () => {
    if(itemSearchInput.value.trim()) handleItemSearchInput();
  });
  itemSearchInput.addEventListener('blur', closeSuggestions);

  categorySelect.addEventListener('change', () => {
    highlightItem = null;
    itemSearchInput.value = '';
    closeSuggestions();
    showCategory();
  });

  renderPopular();
  showCategory();
</script>

</body>
</html>
